[tasks.build]
description = "构建 Debug 版本"
run = "swift build"

[tasks."build:release"]
description = "构建 Release 版本"
run = "swift build -c release -Xswiftc -Osize"

[tasks.test]
description = "运行 Swift 测试"
run = "swift test"

[tasks."test:coverage"]
description = "运行带覆盖率的 Swift 测试"
run = "swift test --enable-code-coverage"

[tasks.coverage]
description = "检查测试覆盖率"
run = "scripts/check_coverage.sh 35"

[tasks."lint:scripts"]
description = "检查仓库 Shell 脚本语法"
run = "scripts/check_shell.sh"

[tasks.check]
description = "运行完整本地验证"
run = "mise run lint:scripts && mise run test:coverage && mise run coverage && mise run build:release"

[tasks.deploy]
description = "构建、签名并启动 LaunchScope Dev.app"
run = "./deploy.sh"

[tasks."test:ui"]
description = "部署签名应用并运行 UI 冒烟测试"
run = "scripts/ui_smoke.sh"

[tasks."acceptance:release"]
description = "创建可回收测试项目并验收四类停用恢复流程"
run = "scripts/release_acceptance.sh"

[tasks."smoke:release"]
description = "验收指定正式 DMG 的主窗口与 Dock 图标；参数为 DMG 路径和版本"
run = "scripts/release_smoke.sh"

[tasks.release]
description = "构建签名 DMG；版本号通过 -- 传入"
run = "./release.sh"

[tasks.publish]
description = "构建并发布 GitHub Release；版本号通过 -- 传入"
run = "scripts/publish.sh"
